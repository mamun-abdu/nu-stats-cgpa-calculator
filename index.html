<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NU Statistics CGPA Calculator · পরিসংখ্যান সিজিপিএ ক্যালকুলেটর</title>
  <meta name="description" content="Free GPA and CGPA calculator for National University Bangladesh Statistics students. Pick your session, and the right NU syllabus loads for every year. Works in English and Bangla.">
  <meta name="author" content="Mamun Abdu">
  <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://mamun-abdu.github.io/nu-stats-cgpa-calculator/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NU Statistics CGPA Calculator">
  <meta property="og:description" content="Pick your session, choose your grades, see your GPA and CGPA. Built on National University's official Statistics syllabus.">
  <meta property="og:url" content="https://mamun-abdu.github.io/nu-stats-cgpa-calculator/">
  <meta property="og:image" content="https://mamun-abdu.github.io/nu-stats-cgpa-calculator/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NU Statistics CGPA Calculator">
  <meta name="twitter:description" content="GPA & CGPA for National University Statistics students, in English and Bangla.">
  <meta name="twitter:image" content="https://mamun-abdu.github.io/nu-stats-cgpa-calculator/og.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d9653b'/%3E%3Cpath d='M18 42 L28 30 L36 36 L47 20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/DMSans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var th = localStorage.getItem('nuStatsCgpa.theme'); if (th) document.documentElement.dataset.theme = th;
      var st = JSON.parse(localStorage.getItem('nuStatsCgpa.v2') || 'null');
      var lg = st && st.lang || ((navigator.language || '').indexOf('bn') === 0 ? 'bn' : 'en');
      document.documentElement.lang = lg;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <header class="bar">
    <div class="wrap bar-in">
      <a class="mark" href="#" aria-label="NU Statistics CGPA">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="M8 21l5-6 4 3 6-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="mark-txt"><b data-i18n="brand">Stats CGPA</b><small data-i18n="brandSub">National University</small></span>
      </a>
      <div class="bar-actions">
        <button class="chip-btn" id="sessionBtn" type="button" hidden></button>
        <button class="chip-btn" id="langBtn" type="button" lang="bn">বাংলা</button>
        <button class="round-btn" id="themeBtn" type="button" data-i18n-aria="theme" aria-label="Switch theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap"></main>

  <footer class="wrap foot">
    <p class="disc" id="disclaimer"></p>
    <p class="fine" id="footCredit"></p>
  </footer>

  <dialog id="sessionDialog" aria-labelledby="sdTitle">
    <form method="dialog" class="dlg">
      <div class="dlg-head">
        <h2 id="sdTitle" data-i18n="pickTitleShort">Your session</h2>
        <button class="round-btn" value="cancel" data-i18n-aria="close" aria-label="Close">✕</button>
      </div>
      <div id="sdBody"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="calc.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
