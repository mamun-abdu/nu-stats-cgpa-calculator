name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the scripts parse
        run: for f in app.js calc.js data.js i18n.js sw.js; do node --check "$f"; done
      - name: Run the calculator tests
        run: npm test
